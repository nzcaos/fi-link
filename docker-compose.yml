services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fichtelink}
      POSTGRES_USER: ${POSTGRES_USER:-fichtelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fichtelink} -d ${POSTGRES_DB:-fichtelink}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "manage.py", "procrastinate", "worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  imap_idle:
    build: .
    command: ["python", "manage.py", "imap_idle_daemon"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Matrix homeserver (docs/matrix-implementation-plan.md, Phase 0). Uses a
  # SEPARATE database `synapse` in the existing `db` instance (collation C) —
  # see docs/matrix-phase0-operator.md for the one-time CREATE DATABASE and
  # signing-key generation. Config + keys live in the host-mounted ./synapse
  # dir (gitignored); copy synapse/homeserver.yaml.example to
  # synapse/homeserver.yaml and fill the secrets there.
  synapse:
    image: matrixdotorg/synapse:latest
    command: ["run"]
    env_file: .env
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./synapse:/data
    ports:
      # Bind to one interface (SYNAPSE_BIND_ADDR, default 127.0.0.1) so 8008 is
      # not world-reachable — Docker port publishing BYPASSES ufw, so the bind
      # address is the real control, not a firewall rule. Set SYNAPSE_BIND_ADDR
      # to the VM's private IP when the reverse proxy is on a separate host.
      # 8448 is NOT mapped — federation runs through the Apache .well-known
      # delegation on 443.
      - "${SYNAPSE_BIND_ADDR:-127.0.0.1}:${SYNAPSE_PORT:-8008}:8008"
    restart: unless-stopped

volumes:
  pgdata:
  media:
  staticfiles:
