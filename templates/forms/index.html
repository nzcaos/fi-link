{% extends "base.html" %}
{% block title %}Formulare — Fichtelink{% endblock %}
{% block content %}
  <h1>Formulare</h1>
  {% if forms %}
    <ul>
      {% for form in forms %}
        <li><a href="{% url 'forms:detail' pk=form.pk %}">{{ form.title }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p style="color:#666">Es sind keine Formulare für Sie freigegeben.</p>
  {% endif %}
{% endblock %}
